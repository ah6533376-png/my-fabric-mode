name: Build and verify mod
on:
  push:
    branches: ["ai-mod/glowberry-tart", "main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Generate item texture
        run: python3 scripts/generate_texture.py
      - name: Build JAR
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: glowberry-tart-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
